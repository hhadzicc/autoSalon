name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
env:
  IMAGE_NAME: ghcr.io/hhadzicc/autosalon

permissions:
  contents: read

jobs:
  verify:
    name: Test and validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WEB_IMAGE: ghcr.io/hhadzicc/autosalon:ci-validation
      APP_DOMAIN: autosalon.example.com
      MSSQL_SA_PASSWORD: ComposeValidation123!
      DEMO_ADMIN_PASSWORD: ComposeValidation123!
      DEMO_BUYER_PASSWORD: ComposeValidation123!
      DEMO_SELLER_PASSWORD: ComposeValidation123!
      SEQ_ADMIN_PASSWORD_HASH: compose-validation-hash
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Validate Docker Compose files
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.standalone.yml config --quiet

      - name: Run tests in .NET 8 SDK container
        run: docker build --target test --tag autosalon-tests:${{ github.sha }} .

      - name: Build production image
        run: docker build --target final --tag autosalon:${{ github.sha }} .

  publish:
    name: Publish application image
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          target: final
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
