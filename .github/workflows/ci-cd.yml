name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the verified image to the production server
        required: true
        default: false
        type: boolean

env:
  IMAGE_NAME: ghcr.io/hhadzicc/autosalon

permissions:
  contents: read

jobs:
  verify:
    name: Test and validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WEB_IMAGE: ghcr.io/hhadzicc/autosalon:ci-validation
      APP_DOMAIN: autosalon.example.com
      MSSQL_SA_PASSWORD: ComposeValidation123!
      DEMO_ADMIN_PASSWORD: ComposeValidation123!
      DEMO_BUYER_PASSWORD: ComposeValidation123!
      DEMO_SELLER_PASSWORD: ComposeValidation123!
      SEQ_ADMIN_PASSWORD_HASH: compose-validation-hash
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Validate Docker Compose files
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.standalone.yml config --quiet

      - name: Run tests in .NET 8 SDK container
        run: docker build --target test --tag autosalon-tests:${{ github.sha }} .

      - name: Build production image
        run: docker build --target final --tag autosalon:${{ github.sha }} .

  publish:
    name: Publish application image
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          target: final
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy through Tailscale
    needs: publish
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      packages: read
    steps:
      - name: Validate deployment configuration
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          test -n "$DEPLOY_HOST" || { echo "::error::Missing production variable DEPLOY_HOST"; exit 1; }
          test -n "$DEPLOY_USER" || { echo "::error::Missing production variable DEPLOY_USER"; exit 1; }
          test -n "$DEPLOY_PATH" || { echo "::error::Missing production variable DEPLOY_PATH"; exit 1; }

      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Connect runner to the tailnet
        uses: tailscale/github-action@v4.1.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          ping: ${{ vars.DEPLOY_HOST }}

      - name: Configure SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ secrets.DEPLOY_SSH_HOST_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'EOF'
          Host *
            BatchMode yes
            ConnectTimeout 15
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ServerAliveInterval 15
            ServerAliveCountMax 2
          EOF
          chmod 600 ~/.ssh/config

      - name: Upload exact deployment configuration
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          # DEPLOY_PATH is a trusted protected-environment variable.
          # shellcheck disable=SC2029
          tar -czf - .env.example docker-compose.yml deploy/deploy.sh | \
            ssh "$DEPLOY_USER@$DEPLOY_HOST" \
              "install -d -m 755 '$DEPLOY_PATH' && tar -xzf - -C '$DEPLOY_PATH'"

      - name: Sign server in to container registry
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

      - name: Deploy exact verified image
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          IMAGE: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
        run: |
          # Trusted deployment settings are intentionally expanded by this runner.
          # shellcheck disable=SC2029
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && sh deploy/deploy.sh '$IMAGE'"

      - name: Remove temporary registry credentials
        if: always()
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: ssh "$DEPLOY_USER@$DEPLOY_HOST" 'docker logout ghcr.io' || true
