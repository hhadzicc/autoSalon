name: Deploy production
run-name: Deploy ${{ github.sha }} to production

on:
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/hhadzicc/autosalon
  IMAGE: ghcr.io/hhadzicc/autosalon:sha-${{ github.sha }}

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy through Tailscale
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      packages: read
    steps:
      - name: Validate deployment configuration
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          test -n "$DEPLOY_HOST" || { echo "::error::Missing production variable DEPLOY_HOST"; exit 1; }
          test -n "$DEPLOY_USER" || { echo "::error::Missing production variable DEPLOY_USER"; exit 1; }
          test -n "$DEPLOY_PATH" || { echo "::error::Missing production variable DEPLOY_PATH"; exit 1; }

      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify published application image
        run: docker buildx imagetools inspect "$IMAGE"

      - name: Connect runner to the tailnet
        uses: tailscale/github-action@v4.1.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          ping: ${{ vars.DEPLOY_HOST }}

      - name: Configure SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ secrets.DEPLOY_SSH_HOST_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'EOF'
          Host *
            BatchMode yes
            ConnectTimeout 15
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ServerAliveInterval 15
            ServerAliveCountMax 2
          EOF
          chmod 600 ~/.ssh/config

      - name: Upload exact deployment configuration
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          # DEPLOY_PATH is a trusted protected-environment variable.
          # shellcheck disable=SC2029
          tar -czf - .env.example docker-compose.yml deploy/deploy.sh | \
            ssh "$DEPLOY_USER@$DEPLOY_HOST" \
              "install -d -m 755 '$DEPLOY_PATH' && tar -xzf - -C '$DEPLOY_PATH'"

      - name: Sign server in to container registry
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

      - name: Deploy exact verified image
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          # Trusted deployment settings are intentionally expanded by this runner.
          # shellcheck disable=SC2029
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && sh deploy/deploy.sh '$IMAGE'"

      - name: Remove temporary registry credentials
        if: always()
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: ssh "$DEPLOY_USER@$DEPLOY_HOST" 'docker logout ghcr.io' || true
