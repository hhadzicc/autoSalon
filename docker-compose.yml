# DEFAULT LOCAL VARIANT
# Starts without an .env file at http://127.0.0.1:8080.
# Only the ASP.NET app is published; the database stays inside Docker.

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-AutoSalon_Demo123!}
    volumes:
      - autosalon-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "(/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\")"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  web:
    image: ${WEB_IMAGE:-autosalon-onezone:local}
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      HttpsRedirection__Enabled: "false"
      ReverseProxy__KnownProxy: ${REVERSE_PROXY_KNOWN_PROXY:-}
      ConnectionStrings__DefaultConnection: Server=db,1433;Database=AutoSalonDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-AutoSalon_Demo123!};TrustServerCertificate=True;MultipleActiveResultSets=true
      Database__ApplyMigrations: "true"
      Database__SeedDemoData: "true"
      Demo__Enabled: ${DEMO_MODE:-false}
      Demo__ResetEnabled: ${DEMO_RESET_ENABLED:-false}
      Demo__ResetIntervalMinutes: ${DEMO_RESET_INTERVAL_MINUTES:-60}
      AdminUserSecrets__Email: ${DEMO_ADMIN_EMAIL:-admin@autosalon.local}
      AdminUserSecrets__Password: ${DEMO_ADMIN_PASSWORD:-Admin123!}
      AdminUserSecrets__FirstName: ${DEMO_ADMIN_FIRST_NAME:-Demo}
      AdminUserSecrets__LastName: ${DEMO_ADMIN_LAST_NAME:-Admin}
      DemoUsers__BuyerEmail: ${DEMO_BUYER_EMAIL:-kupac@autosalon.local}
      DemoUsers__BuyerPassword: ${DEMO_BUYER_PASSWORD:-Kupac123!}
      DemoUsers__SellerEmail: ${DEMO_SELLER_EMAIL:-prodavac@autosalon.local}
      DemoUsers__SellerPassword: ${DEMO_SELLER_PASSWORD:-Prodavac123!}
      Resend__Enabled: ${EMAIL_SENDING_ENABLED:-false}
      Resend__ApiKey: ${RESEND_API_KEY:-}
      Resend__FromEmail: ${FROM_EMAIL:-}
      VehicleImageStorage__UploadsPath: /app/App_Data/VehicleUploads
      Stripe__UseMockPayments: ${STRIPE_USE_MOCK_PAYMENTS:-true}
      Stripe__SecretKey: ${STRIPE_SECRET_KEY:-}
      Stripe__PublishableKey: ${STRIPE_PUBLISHABLE_KEY:-}
      ActivityLogging__Enabled: "true"
      ActivityLogging__LogPath: /app/App_Data/Logs
      ActivityLogging__SeqUrl: http://seq
    ports:
      - "127.0.0.1:${APP_HTTP_PORT:-8080}:8080"
    volumes:
      - autosalon-keys:/app/Keys
      - ./runtime/vehicle-uploads:/app/App_Data/VehicleUploads
      - ./runtime/logs:/app/App_Data/Logs
    networks:
      - default
      - observability_internal
    restart: unless-stopped

  seq:
    image: datalust/seq:latest
    environment:
      ACCEPT_EULA: "Y"
      # The local fallback matches the documented demo password without storing
      # that password in the container environment or forcing a first-login reset.
      SEQ_FIRSTRUN_ADMINPASSWORDHASH: ${SEQ_ADMIN_PASSWORD_HASH:-QF7iBypTmsDKvWL5qlPpv28shVYsgb3iKwdP/NU8hF1N+9kQvmpyh7Pcl05L7owwmcffl9DMkzWF4Y2Cv3Nemg/9P5rvmTYiaz654ALmd4ka}
    ports:
      - "127.0.0.1:${SEQ_HTTP_PORT:-5341}:80"
    volumes:
      - ./runtime/seq-data:/data
    networks:
      - observability_internal
    restart: unless-stopped

volumes:
  autosalon-sql-data:
  autosalon-keys:

networks:
  default:
    ipam:
      config:
        - subnet: ${APP_NETWORK_SUBNET:-172.30.250.0/24}
  observability_internal:
