# STANDALONE VPS VARIANT
# Prerequisites: APP_DOMAIN and production passwords in .env, DNS pointed to
# the VPS, and host ports 80/443 open.
# Start: docker compose -f docker-compose.standalone.yml up -d --build

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD for standalone deployment}
    volumes:
      - autosalon-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "(/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\")"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - app_internal
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      HttpsRedirection__Enabled: "false"
      ConnectionStrings__DefaultConnection: Server=db,1433;Database=AutoSalonDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD for standalone deployment};TrustServerCertificate=True;MultipleActiveResultSets=true
      Database__ApplyMigrations: "true"
      Database__SeedDemoData: "true"
      Demo__Enabled: ${DEMO_MODE:-false}
      Demo__ResetEnabled: ${DEMO_RESET_ENABLED:-false}
      Demo__ResetIntervalMinutes: ${DEMO_RESET_INTERVAL_MINUTES:-60}
      AdminUserSecrets__Email: ${DEMO_ADMIN_EMAIL:-admin@autosalon.local}
      AdminUserSecrets__Password: ${DEMO_ADMIN_PASSWORD:?Set DEMO_ADMIN_PASSWORD for standalone deployment}
      AdminUserSecrets__FirstName: ${DEMO_ADMIN_FIRST_NAME:-Demo}
      AdminUserSecrets__LastName: ${DEMO_ADMIN_LAST_NAME:-Admin}
      DemoUsers__BuyerEmail: ${DEMO_BUYER_EMAIL:-kupac@autosalon.local}
      DemoUsers__BuyerPassword: ${DEMO_BUYER_PASSWORD:?Set DEMO_BUYER_PASSWORD for standalone deployment}
      DemoUsers__SellerEmail: ${DEMO_SELLER_EMAIL:-prodavac@autosalon.local}
      DemoUsers__SellerPassword: ${DEMO_SELLER_PASSWORD:?Set DEMO_SELLER_PASSWORD for standalone deployment}
      Resend__Enabled: ${EMAIL_SENDING_ENABLED:-false}
      Resend__ApiKey: ${RESEND_API_KEY:-}
      Resend__FromEmail: ${FROM_EMAIL:-}
      ReverseProxy__KnownProxy: ${STANDALONE_PROXY_IP:-172.30.251.10}
      Stripe__UseMockPayments: ${STRIPE_USE_MOCK_PAYMENTS:-true}
      Stripe__SecretKey: ${STRIPE_SECRET_KEY:-}
      Stripe__PublishableKey: ${STRIPE_PUBLISHABLE_KEY:-}
    expose:
      - "8080"
    volumes:
      - autosalon-keys:/app/Keys
    networks:
      - app_internal
    restart: unless-stopped

  proxy:
    image: caddy:2-alpine
    depends_on:
      - web
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN for standalone HTTPS deployment}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/caddy/Caddyfile.standalone:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      app_internal:
        ipv4_address: ${STANDALONE_PROXY_IP:-172.30.251.10}
    restart: unless-stopped

volumes:
  autosalon-sql-data:
  autosalon-keys:
  caddy-data:
  caddy-config:

networks:
  app_internal:
    ipam:
      config:
        - subnet: ${STANDALONE_NETWORK_SUBNET:-172.30.251.0/24}
